<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tandem · shared browser viewer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0c1216; color: #e4eaee;
      font-family: ui-monospace, "IBM Plex Mono", monospace; }
    #bar { height: 44px; display: flex; align-items: center; gap: 14px; padding: 0 14px;
      border-bottom: 1px solid #26313a; font-size: 13px; }
    #bar b { color: #3fd0c4; }
    .owner { display: flex; align-items: center; gap: 7px; }
    .dd { width: 9px; height: 9px; border-radius: 50%; }
    .agent .dd { background: #3fd0c4; box-shadow: 0 0 0 3px #3fd0c421; }
    .user .dd { background: #ff7a5c; box-shadow: 0 0 0 3px #ff7a5c24; }
    #wheel { margin-left: auto; height: 30px; padding: 0 14px; border-radius: 6px; font: inherit;
      font-weight: 600; cursor: pointer; border: 1px solid #ff7a5c; color: #ff7a5c; background: #ff7a5c1a; }
    #wheel.mine { background: #ff7a5c; color: #fff; }
    #banner { display: none; align-items: center; gap: 10px; padding: 9px 14px;
      background: #f2b44121; border-bottom: 1px solid #f2b441; color: #f2b441; font-size: 13px; }
    #banner.show { display: flex; }
    #stage { position: absolute; top: 44px; left: 0; right: 0; bottom: 0; display: grid; place-items: center;
      background: #060a0d; }
    #screen { max-width: 100%; max-height: 100%; box-shadow: 0 8px 40px rgba(0,0,0,.5); cursor: crosshair; }
    #hint { position: fixed; bottom: 10px; left: 14px; font-size: 11px; color: #63707b; }
  </style>
</head>
<body>
  <div id="bar">
    <b>Tandem · shared browser</b>
    <span id="ownerbox" class="owner agent"><span class="dd"></span><span id="owner">Agent has the wheel</span></span>
    <button id="wheel">Grab the wheel</button>
  </div>
  <div id="banner"><span>🖐</span><span id="bantext"></span></div>
  <div id="stage"><img id="screen" alt="shared browser screencast" /></div>
  <div id="hint">live CDP screencast of a headless Chrome the agent is also driving · click/type when you hold the wheel</div>

  <script type="module">
    const img = document.getElementById('screen');
    const wheel = document.getElementById('wheel');
    const ownerBox = document.getElementById('ownerbox');
    const ownerEl = document.getElementById('owner');
    const banner = document.getElementById('banner');
    const bantext = document.getElementById('bantext');
    const NATIVE_W = 1280, NATIVE_H = 800;
    let owner = 'agent';

    const ws = new WebSocket('ws://localhost:7788');
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.t === 'frame') img.src = 'data:image/jpeg;base64,' + m.data;
      else if (m.t === 'owner') setOwner(m.owner);
      else if (m.t === 'takeover') { bantext.textContent = m.reason + '  —  [Grab the wheel]'; banner.classList.add('show'); }
    };

    function setOwner(o) {
      owner = o;
      ownerBox.className = 'owner ' + o;
      ownerEl.textContent = o === 'user' ? 'You have the wheel' : 'Agent has the wheel';
      wheel.textContent = o === 'user' ? 'Release to agent' : 'Grab the wheel';
      wheel.classList.toggle('mine', o === 'user');
      if (o === 'user') banner.classList.remove('show');
    }
    wheel.onclick = () => ws.send(JSON.stringify({ t: owner === 'user' ? 'release' : 'grab' }));

    // map a click on the (scaled) screencast image back to native page coords
    function toNative(ev) {
      const r = img.getBoundingClientRect();
      return { x: (ev.clientX - r.left) * (NATIVE_W / r.width), y: (ev.clientY - r.top) * (NATIVE_H / r.height) };
    }
    img.addEventListener('mousedown', (ev) => { if (owner !== 'user') return; const p = toNative(ev); ws.send(JSON.stringify({ t: 'input', kind: 'click', x: p.x, y: p.y })); });
    img.addEventListener('mousemove', (ev) => { if (owner !== 'user') return; const p = toNative(ev); ws.send(JSON.stringify({ t: 'input', kind: 'move', x: p.x, y: p.y })); });
    window.addEventListener('keydown', (ev) => { if (owner !== 'user' || ev.key.length !== 1) return; ws.send(JSON.stringify({ t: 'input', kind: 'text', text: ev.key })); });
  </script>
</body>
</html>
