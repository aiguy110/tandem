name: Go foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build with metadata
        env:
          VERSION: dev
          COMMIT: ${{ github.sha }}
        run: |
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go build -ldflags "-X github.com/aiguy110/tandem/internal/buildinfo.Version=${VERSION} -X github.com/aiguy110/tandem/internal/buildinfo.Commit=${COMMIT} -X github.com/aiguy110/tandem/internal/buildinfo.BuildTime=${BUILD_TIME}" ./cmd/tandem
          test "$(./tandem version)" = "tandem version=${VERSION} commit=${COMMIT} built=${BUILD_TIME}"
